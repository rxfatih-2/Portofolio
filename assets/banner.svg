<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="RXFatih Naruto Shinobi Animated Banner">
  <defs>
    <linearGradient id="bgBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07070a" />
      <stop offset="52%" stop-color="#0d0d12" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <radialGradient id="kuramaAura" cx="18%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.34" />
      <stop offset="55%" stop-color="#ea580c" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="rasenganAura" cx="84%" cy="46%" r="46%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.26" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="rasenganCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="chakraClashBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.95" />
      <stop offset="48%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="52%" stop-color="#e0f2fe" stop-opacity="1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.95" />
    </linearGradient>

    <pattern id="shojiLattice" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="900" height="280" rx="16" fill="url(#bgBase)" />
  <rect width="900" height="280" rx="16" fill="url(#shojiLattice)" />
  <rect width="900" height="280" rx="16" fill="url(#kuramaAura)" />
  <rect width="900" height="280" rx="16" fill="url(#rasenganAura)" />
  <rect x="1" y="1" width="898" height="278" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />

  <text x="855" y="232" text-anchor="end" fill="#ffffff" fill-opacity="0.035" font-family="serif" font-size="135" font-weight="700">忍</text>
  <text x="868" y="42" text-anchor="end" fill="#f97316" fill-opacity="0.85" font-family="serif" font-size="15" font-weight="700" letter-spacing="3">終末の谷</text>

  <g transform="translate(158, 140)">
    <circle r="60" fill="none" stroke="#f97316" stroke-width="1.8">
