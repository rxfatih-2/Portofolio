    <text x="0" y="44" fill="#fafafa" font-family="sans-serif" font-size="36" font-weight="800" letter-spacing="-0.6">M. Rizki Akbar</text>
    <text x="0" y="74" fill="#d4d4d8" font-family="sans-serif" font-size="15.5">Pengembang Web Frontend &amp; Undangan Pernikahan Digital</text>

    <rect x="0" y="96" width="560" height="2.5" rx="1.25" fill="url(#chakraClashBeam)">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="2.4s" repeatCount="indefinite" />
    </rect>

    <g transform="translate(0, 118)">
      <rect width="166" height="30" rx="6" fill="#14141a" stroke="#38bdf8" stroke-opacity="0.42" />
      <circle cx="16" cy="15" r="4" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="19.5" fill="#fafafa" font-family="monospace" font-size="11.5" font-weight="700">06 PORTAL AKTIF</text>

      <rect x="178" width="176" height="30" rx="6" fill="#14141a" stroke="#f97316" stroke-opacity="0.45" />
      <circle cx="194" cy="15" r="4" fill="#f97316">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="1.6s" repeatCount="indefinite" />
      </circle>
      <text x="206" y="19.5" fill="#f97316" font-family="monospace" font-size="11.5" font-weight="700">GERBANG SHOJI 3D</text>

      <rect x="366" width="144" height="30" rx="6" fill="#14141a" stroke="#ffffff" stroke-opacity="0.18" />
      <text x="382" y="19.5" fill="#a1a1aa" font-family="monospace" font-size="11.5" font-weight="700">GITHUB PAGES</text>
