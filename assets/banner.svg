    <circle r="76" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="14 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite" />
    </circle>

    <circle r="63" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="5 8">
