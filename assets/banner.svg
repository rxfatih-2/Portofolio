      <animate attributeName="stroke-opacity" values="0.75;0.04;0.75" dur="3.2s" repeatCount="indefinite" />
    </circle>

    <circle r="54" fill="none" stroke="#38bdf8" stroke-width="1.4">
      <animate attributeName="r" values="48;78;48" dur="2.6s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.65;0.05;0.65" dur="2.6s" repeatCount="indefinite" />
