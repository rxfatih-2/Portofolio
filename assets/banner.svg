    </circle>

    <g fill="none" stroke="#fafafa" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 0 -2 C 5 -2, 8 2, 7 7 C 6 13, -2 15, -8 12 C -15 8, -16 -3, -10 -10 C -3 -18, 10 -17, 17 -9 C 22 -3, 22 6, 18 13" />
      <path d="M 14 -12 L 26 -17 L 20 -5" />
      <path d="M -12 9 L -21 17" />
